<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#ffc72c"/>
      <stop offset="70%" stop-color="#d49b29"/>
      <stop offset="100%" stop-color="#8a5e0b"/>
    </linearGradient>

    <!-- Supercell Red Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e63939"/>
      <stop offset="50%" stop-color="#b81d1d"/>
      <stop offset="100%" stop-color="#730e0e"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Clash Shield Emblem Badge -->
  <g filter="url(#dropShadow)" transform="translate(10, 10)">
    <!-- Outer Shield Border -->
    <path d="M 50,5 L 85,25 L 80,75 L 50,95 L 20,75 L 15,25 Z" fill="url(#goldGrad)" stroke="#5e3e06" stroke-width="3"/>
    <!-- Inner Shield Red Fill -->
    <path d="M 50,10 L 80,28 L 76,72 L 50,88 L 24,72 L 20,28 Z" fill="url(#shieldGrad)"/>

    <!-- Crossed Swords Motif -->
    <path d="M 28,25 L 72,75 M 72,25 L 28,75" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="10" fill="url(#goldGrad)" stroke="#3d2703" stroke-width="2"/>
  </g>

  <!-- 3D "CLASH OF CLANS" Metallic Typography -->
  <g filter="url(#dropShadow)" transform="translate(105, 68)">
    <!-- Black Outline Shadow Stroke -->
    <text x="0" y="0" font-family="'Luckiest Guy', 'Kanit', sans-serif" font-size="44" font-weight="900" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round">CLASH OF CLANS</text>
    <text x="0" y="0" font-family="'Luckiest Guy', 'Kanit', sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" stroke="#5e3e06" stroke-width="2">CLASH OF CLANS</text>
  </g>
</svg>
