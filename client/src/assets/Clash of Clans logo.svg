<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <!-- Red Shield Gradient -->
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b81b1b"/>
      <stop offset="50%" stop-color="#8a0f0f"/>
      <stop offset="100%" stop-color="#540808"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="40%" stop-color="#ffc72c"/>
      <stop offset="80%" stop-color="#d49319"/>
      <stop offset="100%" stop-color="#825405"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="translate(10, 8)">
    <!-- Gold Outer Shield Frame (Hexagon Shield shape matching screenshot) -->
    <path d="M 35,5 L 65,5 L 80,25 L 80,65 L 65,85 L 35,85 L 20,65 L 20,25 Z" fill="url(#goldMetallic)" stroke="#4a2c03" stroke-width="3"/>
    
    <!-- Inner Red Shield -->
    <path d="M 37,9 L 63,9 L 76,27 L 76,63 L 63,81 L 37,81 L 24,63 L 24,27 Z" fill="url(#shieldRed)"/>

    <!-- Diagonal Gold Straps (X motif matching screenshot) -->
    <line x1="26" y1="12" x2="74" y2="78" stroke="url(#goldMetallic)" stroke-width="7" stroke-linecap="round"/>
    <line x1="74" y1="12" x2="26" y2="78" stroke="url(#goldMetallic)" stroke-width="7" stroke-linecap="round"/>

    <!-- Center Gold Circle Stud -->
    <circle cx="50" cy="45" r="11" fill="url(#goldMetallic)" stroke="#3b2102" stroke-width="2"/>
  </g>

  <!-- "CLASH OF CLANS" Gold Text matching screenshot -->
  <g filter="url(#shadow)" transform="translate(100, 64)">
    <!-- Black Outline Stroke -->
    <text x="0" y="0" font-family="'Luckiest Guy', 'Kanit', sans-serif" font-size="46" font-weight="900" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round" letter-spacing="1">CLASH OF CLANS</text>
    <!-- Gold Gradient Fill -->
    <text x="0" y="0" font-family="'Luckiest Guy', 'Kanit', sans-serif" font-size="46" font-weight="900" fill="url(#goldMetallic)" stroke="#523403" stroke-width="2" letter-spacing="1">CLASH OF CLANS</text>
  </g>
</svg>
